<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a
      routerLink="/dashboard"
      class="text-lg font-bold tracking-tight text-slate-900"
    >
      Incident <span class="text-teal-600">Replay</span>
    </a>

    <nav class="flex items-center gap-2">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-slate-100 text-slate-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900"
      >
        Dashboard
      </a>

      <a
        routerLink="/incidents"
        routerLinkActive="bg-slate-100 text-slate-900"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900"
      >
        Incidents
      </a>

      <a
        routerLink="/incidents/new"
        routerLinkActive="bg-teal-50 text-teal-700"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900"
      >
        Create
      </a>

      <button
        type="button"
        (click)="logout()"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-500 hover:bg-red-50 hover:text-red-600"
      >
        Logout
      </button>
    </nav>
  </div>
</header>

<main class="min-h-[calc(100vh-73px)] bg-slate-50">
  <router-outlet />
</main>
