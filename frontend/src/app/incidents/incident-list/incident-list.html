<div class="mb-6">
  <input
    type="text"
    placeholder="Search incidents..."
    (input)="handleSearch($event)"
    class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-teal-500 focus:ring-2 focus:ring-teal-100"
  >
</div>

@if (filteredIncidents().length === 0) {
  <div
    class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-10 text-center"
  >
    <p class="font-medium text-slate-700">
      No incidents found.
    </p>

    <p class="mt-1 text-sm text-slate-500">
      Try changing your search or filter.
    </p>
  </div>
}

<div class="grid gap-4 md:grid-cols-2">
  @for (
    incident of filteredIncidents();
    track incident.id
  ) {
    <app-incident-card
      [incident]="incident"
      (resolve)="handleResolve($event)"
      (delete)="handleDelete($event)"
    />
  }
</div>
