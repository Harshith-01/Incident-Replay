<article
  class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <h3 class="text-lg font-semibold text-slate-900">
        {{ incident().title }}
      </h3>

      <p class="mt-1 text-sm text-slate-500">
        {{ incident().service }}
      </p>
    </div>

    <span
      class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700"
    >
      {{ incident().status | incidentStatus }}
    </span>
  </div>

  <p class="mb-5 text-sm leading-6 text-slate-600">
    {{ incident().description }}
  </p>

  <div class="flex flex-wrap gap-2">
    <a
      [routerLink]="['/incidents', incident().id]"
      class="rounded-lg bg-slate-900 px-3 py-2 text-sm font-medium text-white transition hover:bg-slate-700"
    >
      View details
    </a>

    @if (incident().status !== 'Resolved') {
      <button
        type="button"
        (click)="resolveIncident()"
        class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700 transition hover:bg-emerald-100"
      >
        Resolve
      </button>
    }

    <button
      type="button"
      (click)="deleteIncident()"
      class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700 transition hover:bg-red-100"
    >
      Delete
    </button>
  </div>
</article>
