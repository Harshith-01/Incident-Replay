<section class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mb-10">
    <p class="text-sm font-semibold uppercase tracking-wider text-teal-600">
      Operations overview
    </p>

    <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">
      Incident Replay
    </h1>

    <p class="mt-2 max-w-2xl text-slate-500">
      Monitor production incidents and investigate what happened.
    </p>
  </div>

  <div class="grid gap-4 md:grid-cols-3">
    <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm font-medium text-slate-500">
        Total incidents
      </p>

      <p class="mt-3 text-3xl font-bold text-slate-900">
        {{ totalIncidents }}
      </p>
    </article>

    <article class="rounded-2xl border border-amber-200 bg-amber-50 p-6">
      <p class="text-sm font-medium text-amber-700">
        Investigating
      </p>

      <p class="mt-3 text-3xl font-bold text-amber-900">
        {{ activeIncidents }}
      </p>
    </article>

    <article class="rounded-2xl border border-emerald-200 bg-emerald-50 p-6">
      <p class="text-sm font-medium text-emerald-700">
        Resolved
      </p>

      <p class="mt-3 text-3xl font-bold text-emerald-900">
        {{ resolvedIncidents }}
      </p>
    </article>
  </div>

  <div class="mt-8">
    <a
      routerLink="/incidents"
      class="inline-flex rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-700"
    >
      View incidents
    </a>
  </div>
</section>
